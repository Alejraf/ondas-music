<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Ondas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: barra superior fija (Escuchar / Studio), reproductor incrustado visible bajo la barra, contenido en una columna y mini control fijo abajo. */
:root{
  --bg:#0c1215; --surface:#141c20; --surface2:#1c262b; --line:#2a373d;
  --fg:#edf3f3; --muted:#93a6a9; --accent:#3dd6c4; --accent-ink:#04201c;
  --money:#f2b84b; --danger:#ff6b6b; --ok:#5fd68a;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f6f6; --surface:#ffffff; --surface2:#e6eeee; --line:#d1dddd;
    --fg:#0f1d20; --muted:#52676b; --accent:#0b8c80; --accent-ink:#ffffff;
    --money:#a86a00; --danger:#c43c3c; --ok:#1f8a4c; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f6f6; --surface:#ffffff; --surface2:#e6eeee; --line:#d1dddd;
  --fg:#0f1d20; --muted:#52676b; --accent:#0b8c80; --accent-ink:#ffffff;
  --money:#a86a00; --danger:#c43c3c; --ok:#1f8a4c; color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:16px 8px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.logo{font-family:var(--font-display);font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:7px 16px;border-radius:999px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* stage (embedded player) */
#stage{max-width:880px;margin:14px auto 0;display:flex;flex-direction:column;gap:10px}
.frame{width:100%;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.frame[data-k="yt"]{aspect-ratio:16/9;background:#000}
.frame[data-k="sp"]{height:152px}
.frame[data-k="spm"]{height:352px}
.frame[data-k="sc"]{height:166px}
.frame[data-k="scm"]{height:300px}
.frame iframe{width:100%;height:100%;border:0;display:block}
.smeta{display:flex;align-items:center;gap:4px}
.smeta .t{flex:1;min-width:0}
.smeta .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta .t small{color:var(--muted)}
.smeta .on{color:var(--accent)}

/* ad slots */
.ad{border:1.5px dashed var(--line);border-radius:10px;background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--line) 35%,transparent) 10px 11px);
  min-height:var(--h,60px);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;text-align:center;padding:8px;overflow:hidden}
.ad b{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--money)}

/* listener */
.hello h1{font-size:clamp(26px,6vw,36px)}
.hello p{margin:4px 0 0;color:var(--muted)}
.paste{display:flex;gap:8px;flex-wrap:wrap}
.paste input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;outline:0}
.paste input:focus{border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);min-height:1.2em}
.hint.err{color:var(--danger)}
.search{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;background:none;border:0;padding:12px 0;outline:0}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 6px;border-radius:12px}
.row:hover,.row.on{background:var(--surface)}
.row .t{min-width:0;text-align:left}
.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .t b{color:var(--accent)}
.cover{--h:200;width:48px;height:48px;border-radius:8px;flex:none;position:relative;overflow:hidden;background-size:cover;background-position:center;
  background-image:linear-gradient(135deg,hsl(var(--h) 70% 55%),hsl(calc(var(--h) + 55) 65% 30%))}
.ico{width:22px;height:22px;display:block}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex:none}
.ib:hover{background:var(--surface2)}
.liked{color:var(--accent)}
.empty{color:var(--muted);padding:28px 8px;text-align:center}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.badge.ok{color:var(--ok);border-color:currentColor}
.badge.warn{color:var(--money);border-color:currentColor}

/* mini player */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mini-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:6px}
.mini-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.mini-main .t{min-width:0}
.mini-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-main small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

/* studio */
.sub{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.sub button{padding:10px 14px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.sub button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.tile small{color:var(--muted);display:block}
.tile strong{font-family:var(--font-display);font-size:26px;display:block;margin-top:2px}
.tile.money strong{color:var(--money)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:18px}
.card p{margin:0;color:var(--muted)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--money);padding-left:10px}
.btn{background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-weight:700}
.btn.danger{color:var(--danger);border:1px solid currentColor;background:none;font-weight:500;padding:6px 12px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,.crow input[type=text],.crow select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--fg);width:100%;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .meta{min-width:0}
.crow .meta b{display:block}
.crow .meta small{color:var(--muted)}
.crow .full{grid-column:1/-1}
.crow .acts{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crow select{width:auto;padding:6px 8px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(80px,32%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:2px}
.bar div{background:var(--surface2);border-radius:5px}
svg.chart{width:100%;height:auto;display:block}
svg.chart .b{fill:var(--accent)}
svg.chart .b.today{fill:var(--money)}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
svg.chart line{stroke:var(--line);stroke-width:1}
.tg{display:flex;align-items:center;gap:10px;padding:8px 0}
.tg input{width:20px;height:20px;accent-color:var(--accent)}
pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:12px;line-height:1.5}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s linear}}
</style>

<div class="top"><div class="top-in">
  <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><path d="M7 16c2.5-6 4.5-6 6 0s3.5 6 6 0 4-6 6 0" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round"/></svg>Ondas</div>
  <div class="seg" role="group" aria-label="Modo">
    <button id="tabL" data-act="view" data-v="escuchar" aria-pressed="true">Escuchar</button>
    <button id="tabS" data-act="view" data-v="studio" aria-pressed="false">Studio</button>
  </div>
</div></div>

<section id="stage" hidden aria-label="Reproductor">
  <div class="frame" id="frame" data-k="yt"><div id="emb"></div></div>
  <div class="smeta">
    <div class="t"><b id="stTitle"></b><small id="stSub"></small></div>
    <button class="ib" id="stLike" data-act="likeCur" aria-label="Favorito"></button>
    <button class="ib" id="stShuffle" data-act="shuffle" aria-label="Aleatorio"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3c5 0 7 10 12 10h3M3 17h3c1.6 0 2.9-.8 4-2M14 9c1-1.3 2.2-2 4-2h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
    <button class="ib" id="stRepeat" data-act="repeat" aria-label="Repetir"></button>
  </div>
  <div class="note" id="stMsg" hidden></div>
  <div class="hint"><a id="stOpen" href="#" target="_blank" rel="noopener">Abrir en la plataforma</a></div>
</section>

<main id="view"></main>

<div class="mini" id="mini" hidden>
  <div class="prog"><i id="miniBar"></i></div>
  <div class="mini-in">
    <button class="mini-main" data-act="toTop" aria-label="Ir al reproductor">
      <div class="cover" id="miniCover"></div>
      <div class="t"><b id="miniTitle"></b><small id="miniArtist"></small></div>
    </button>
    <button class="ib" data-act="prev" aria-label="Anterior"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="play" data-act="toggle" id="miniPlay" aria-label="Reproducir o pausar"></button>
    <button class="ib" data-act="next" aria-label="Siguiente"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var LS="ondas.v2";
var PN={youtube:"YouTube",spotify:"Spotify",soundcloud:"SoundCloud"};
var PH={youtube:5,spotify:145,soundcloud:25};
var INSIDE_CLAUDE=typeof window.claude!=="undefined";

/* ---------- state ---------- */
function todayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function seed(){return {v:2,items:[],liked:[],daily:[0,0,0,0,0,0,0],dayKey:todayKey(),secs:0,
  ads:{header:true,inline:true,studio:true},zone:"",adSrc:"",cpm:1.2,imps:0}}
var st;
try{st=JSON.parse(localStorage.getItem(LS)||"null")}catch(e){st=null}
if(!st||!st.items)st=seed();
(function(){
  var t=todayKey();
  if(st.dayKey!==t){
    var p=st.dayKey.split("-").map(Number),n=new Date(),then=new Date(p[0],p[1]-1,p[2]);
    var diff=Math.max(1,Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-then)/864e5));
    for(var i=0;i<Math.min(diff,7);i++){st.daily.push(0);st.daily.shift()}
    st.dayKey=t;
  }
})();
var saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}},300)}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nf(n){return Math.round(n).toLocaleString("es")}
function money(n){return "US$ "+n.toLocaleString("es",{minimumFractionDigits:2,maximumFractionDigits:2})}
function hours(sec){var h=sec/3600;return h>=1?h.toLocaleString("es",{maximumFractionDigits:1})+" h":Math.round(sec/60)+" min"}
function byId(id){for(var i=0;i<st.items.length;i++){if(st.items[i].id===id)return st.items[i]}return null}
function imgOk(u){return typeof u==="string"&&/^https:\/\//.test(u)}
function coverStyle(it){return '--h:'+(it?it.hue:200)+(it&&imgOk(it.img)?";background-image:url('"+it.img.replace(/['\"()\\]/g,"")+"')":"")}
function coverHTML(it){return '<div class="cover" style="'+coverStyle(it)+'"></div>'}
var IC={
 play:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
 pause:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
 heart:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9-9.2C1.7 7.7 4 5 7 5c2 0 3.4 1 5 3 1.600-2 3-3 5-3 3 0 5.300 2.700 4 5.800C19 15.600 12 20 12 20z"/></svg>',
 heartOn:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.4-9-9.2C1.7 7.7 4 5 7 5c2 0 3.4 1 5 3 1.600-2 3-3 5-3 3 0 5.300 2.700 4 5.800C19 15.600 12 20 12 20z"/></svg>',
 search:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
 rep:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 013-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 01-3 3H4"/></svg>',
 rep1:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 013-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 01-3 3H4M11 10l1-1v5"/></svg>'
};
var toastT=0;
function toast(msg){
  var el=$("#toast");
  if(!el){el=document.createElement("div");el.id="toast";
    el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;max-width:90vw;font-size:14px";
    document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},2600);
}

/* ---------- link parsing ---------- */
function mkYT(id){
  if(!id||!/^[\w-]{11}$/.test(id))return null;
  return {provider:"youtube",ref:id,canon:"https://www.youtube.com/watch?v="+id,multi:false,key:"yt:"+id,img:"https://i.ytimg.com/vi/"+id+"/mqdefault.jpg"};
}
function mkSP(type,id){
  return {provider:"spotify",ref:type+"/"+id,canon:"https://open.spotify.com/"+type+"/"+id,multi:(type!=="track"&&type!=="episode"),key:"sp:"+type+"/"+id,img:""};
}
function parseLink(raw){
  raw=(raw||"").trim();if(!raw)return null;
  var m=/^spotify:(track|album|playlist|artist|episode|show):([A-Za-z0-9]+)$/.exec(raw);
  if(m)return mkSP(m[1],m[2]);
  var u;try{u=new URL(/^https?:\/\//i.test(raw)?raw:"https://"+raw)}catch(e){return null}
  var h=u.hostname.replace(/^www\./,"").replace(/^m\./,""),p=u.pathname,id=null;
  if(h==="youtu.be")return mkYT(p.slice(1).split("/")[0]);
  if(h==="youtube.com"||h==="music.youtube.com"){
    if(p==="/watch")id=u.searchParams.get("v");
    else{var s=/^\/(shorts|embed|live)\/([\w-]{11})/.exec(p);if(s)id=s[2]}
    return mkYT(id);
  }
  if(h==="open.spotify.com"){
    var q=/^\/(?:intl-[a-z-]+\/)?(?:embed\/)?(track|album|playlist|artist|episode|show)\/([A-Za-z0-9]+)/.exec(p);
    return q?mkSP(q[1],q[2]):null;
  }
  if(h==="soundcloud.com"||h==="on.soundcloud.com"){
    var parts=p.split("/").filter(Boolean);if(!parts.length)return null;
    var canon="https://"+h+"/"+parts.join("/");
    return {provider:"soundcloud",ref:canon,canon:canon,multi:(h==="soundcloud.com"&&(parts.length===1||parts[1]==="sets")),key:"sc:"+canon,img:""};
  }
  return null;
}
function fetchMeta(p){
  var base={youtube:"https://www.youtube.com/oembed?format=json&url=",spotify:"https://open.spotify.com/oembed?url=",soundcloud:"https://soundcloud.com/oembed?format=json&url="}[p.provider];
  return new Promise(function(res){
    var done=false,ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},5000);
    fetch(base+encodeURIComponent(p.canon),{signal:ctl.signal}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
      done=true;clearTimeout(t);res({title:j.title||"",artist:j.author_name||"",img:j.thumbnail_url||""});
    }).catch(function(){if(!done){clearTimeout(t);res({})}});
  });
}
function addLink(raw){
  var p=parseLink(raw);
  if(!p)return Promise.resolve({err:"Pega un enlace válido de YouTube, Spotify o SoundCloud."});
  if(st.items.some(function(i){return i.key===p.key}))return Promise.resolve({err:"Ese enlace ya está en tu biblioteca."});
  return fetchMeta(p).then(function(m){
    var it={id:"i"+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36),key:p.key,provider:p.provider,ref:p.ref,canon:p.canon,multi:p.multi,
      title:m.title||(PN[p.provider]+(p.multi?" · lista":" · canción")),artist:m.artist||"",img:imgOk(m.img)?m.img:(p.img||""),hue:PH[p.provider],
      plays:0,status:"public",autoTitle:!m.title};
    st.items.unshift(it);save();return {ok:it};
  });
